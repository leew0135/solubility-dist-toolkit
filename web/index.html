  All tabs live in this one page (addresses like #/spectra, #/distribution), so the
  Python engine is loaded once and stays alive when you switch tabs.
  Nothing to edit here normally:
    pages and titles -> js/config.js      look -> styles/site.css, styles/figure_styles.js
  To preview on your computer:  python scripts/build_web.py --serve
  (opening this file by double-click does not work: browsers block modules on file://)
-->
